<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>短视频评论模拟器</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fe2c55'/%3E%3Ctext x='32' y='45' font-size='32' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E评%3C/text%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    color: #333;
  }
  .top-bar {
    background: #fff;
    padding: 14px 24px;
    border-bottom: 1px solid #e8e8e8;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .top-bar h1 { font-size: 18px; font-weight: 600; color: #1a1a1a; }
  .top-bar .hint { font-size: 12px; color: #999; }
  .main-wrap {
    display: flex !important;
    flex-direction: row !important;
    gap: 24px;
    padding: 24px;
    max-width: 1200px;
    margin: 0 auto;
    align-items: flex-start;
  }
  .panel-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    border-bottom: 1px solid #eee;
    padding-bottom: 8px;
  }
  .tab-btn {
    flex: 1;
    padding: 8px 12px;
    border: none;
    background: #f5f5f5;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: #666;
  }
  .tab-btn.active {
    background: #fe2c55;
    color: #fff;
  }
  .panel-page {
    display: none;
  }
  .panel-page.active {
    display: block;
  }

  .control-panel {
    flex: 0 0 340px;
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    position: sticky;
    top: 80px;
  }
  .control-panel h2 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 16px;
    color: #1a1a1a;
    padding-bottom: 10px;
    border-bottom: 1px solid #f0f0f0;
  }
  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block;
    font-size: 12px;
    color: #666;
    margin-bottom: 6px;
    font-weight: 500;
  }
  .form-group input, .form-group textarea {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus, .form-group textarea:focus { border-color: #fe2c55; }
  .form-group textarea { resize: vertical; min-height: 60px; }
  .form-row { display: flex; gap: 10px; }
  .form-row .form-group { flex: 1; }
  .checkbox-group {
    display: flex;
    gap: 16px;
    margin-bottom: 14px;
  }
  .checkbox-group label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: #666;
    cursor: pointer;
  }
  .checkbox-group input[type="checkbox"] { accent-color: #fe2c55; width: 14px; height: 14px; }
  .btn {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s;
    font-family: inherit;
  }
  .btn-primary { background: #fe2c55; color: #fff; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-secondary { background: #f5f5f5; color: #666; margin-top: 8px; }
  .btn-secondary:hover { background: #eee; }
  .settings-section {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid #f0f0f0;
  }
  .settings-section h3 { font-size: 13px; font-weight: 600; margin-bottom: 12px; color: #333; }

  /* 头像上传 */
  .avatar-upload-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .avatar-upload-row input[type="text"] { flex: 1; }
  .avatar-upload-btn {
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 12px;
    color: #666;
    cursor: pointer;
    white-space: nowrap;
    background: #fafafa;
    transition: all 0.2s;
  }
  .avatar-upload-btn:hover { border-color: #fe2c55; color: #fe2c55; }
  .avatar-preview-box {
    display: none;
    margin-top: 8px;
    align-items: center;
    gap: 8px;
  }
  .avatar-preview-box.show { display: flex; }
  .avatar-preview-box img {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
  }
  .avatar-preview-box button {
    font-size: 11px;
    color: #999;
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    text-decoration: underline;
  }
  .preset-avatars {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .preset-slot {
    position: relative;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1.5px dashed #ccc;
    background: #fafafa;
    cursor: pointer;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .preset-slot:hover { border-color: #fe2c55; }
  .preset-slot img {
    display: none;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }
  .preset-slot.has-img { border-style: solid; border-color: #e5e7eb; }
  .preset-slot.has-img .ps-plus { display: none; }
  .preset-slot.selected { border-color: #fe2c55; box-shadow: 0 0 0 2px rgba(254, 44, 85, 0.18); }
  .ps-plus {
    font-size: 18px;
    color: #bbb;
    line-height: 1;
    pointer-events: none;
  }

  /* 手机模拟器 */
  .phone-area {
    flex: 1;
    display: flex;
    justify-content: center;
    min-width: 0;
  }
  .phone-frame {
    width: 375px;
    height: 760px;
    background: #000;
    border-radius: 40px;
    padding: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    position: relative;
    flex-shrink: 0;
  }
  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 30px;
    overflow: hidden;
    position: relative;
    background: #161823;
  }
  .video-bg {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #2d2d44 0%, #1a1a2e 50%, #16213e 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .video-bg .play-icon {
    width: 0;
    height: 0;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    border-left: 32px solid rgba(255,255,255,0.7);
    border-top: 22px solid transparent;
    border-bottom: 22px solid transparent;
    margin-left: 8px;
  }

  .video-info {
    position: absolute;
    left: 14px;
    bottom: 70px;
    color: #fff;
    z-index: 2;
  }
  .danmu-btn {
    position: absolute;
    left: 14px;
    bottom: 140px;
    width: 32px;
    height: 32px;
    background: rgba(0,0,0,0.5);
    border-radius: 50%;
    color: #fff;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 3;
  }
  .danmu-btn.active {
    background: rgba(255,0,0,0.6);
  }
  .danmu-btn .edit-icon {
    position: absolute;
    right: 3px;
    bottom: 8px;
    font-size: 8px;
    color: #ffffff !important;
    background: transparent;
    border-radius: 50%;
    width: 10px;
    height: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    filter: brightness(0) invert(1);
  }
  .danmu-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
    overflow: hidden;
  }
  .danmu-item {
    position: absolute;
    left: 100%;
    color: #fff;
    font-size: 16px;
    white-space: nowrap;
    text-shadow: 0 0 2px rgba(0,0,0,0.8);
    animation: danmuScroll linear forwards;
  }
  @keyframes danmuScroll {
    from { transform: translateX(0); }
    to { transform: translateX(-100vw); }
  }
  .video-info .author { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .video-info .desc-wrapper { position: relative; max-width: 233px; font-size: 13px; line-height: 1.5; }
  .video-info .desc { opacity: 1; word-break: break-word; display: inline; }
  .desc-toggle {
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    display: inline;
    font-weight: 500;
    background: transparent;
  }
  .desc-toggle:hover { color: #fff; }
  /* 播放进度条 */
  .video-progress-bar {
    position: absolute;
    bottom: 56px;
    left: 0;
    right: 0;
    padding: 0 12px 4px;
    z-index: 11;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  .video-progress-bar.visible {
    opacity: 1;
    pointer-events: auto;
  }
  .progress-time {
    color: #fff;
    font-size: 11px;
    text-align: right;
    margin-bottom: 4px;
  }
  .progress-track {
    position: relative;
    width: 100%;
    height: 3px;
    background: rgba(255,255,255,0.3);
    border-radius: 2px;
    cursor: pointer;
  }
  .progress-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 0%;
    background: #fff;
    border-radius: 2px;
    transition: width 0.1s linear;
  }
  .progress-thumb {
    position: absolute;
    top: 50%;
    left: 0%;
    transform: translate(-50%, -50%);
    width: 10px;
    height: 10px;
    background: #fff;
    border-radius: 50%;
  }
  .top-nav {
    position: absolute;
    top: 15px;
    left: 0;
    right: 0;
    height: 44px;
    background: transparent;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 12px;
    z-index: 10;
  }
  .top-nav-menu {
    display: flex;
    flex-direction: column;
    gap: 3px;
    align-items: flex-start;
  }
  .top-nav-menu span {
    display: block;
    height: 2px;
    background: #fff;
    border-radius: 1px;
  }
  .top-nav-menu span:nth-child(1) {
    width: 18px;
  }
  .top-nav-menu span:nth-child(2) {
    width: 14px;
  }
  .top-nav-menu span:nth-child(3) {
    width: 10px;
  }
  .top-nav-tabs {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .top-nav-tab {
    color: rgba(255,255,255,0.6);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    position: relative;
    white-space: nowrap;
  }
  .top-nav-tab.active {
    color: #fff !important;
    font-weight: 900 !important;
  }
  .top-nav-search {
    display: flex;
    align-items: center;
  }
  .bottom-nav {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 56px;
    background: rgba(0,0,0,0.85);
    display: grid;
    grid-template-columns: auto auto 1fr auto auto;
    align-items: center;
    padding: 0 16px;
    column-gap: 14px;
    z-index: 10;
  }
  .bottom-nav .nav-item:nth-child(1) { justify-self: end; }
  .bottom-nav .nav-item:nth-child(2) { justify-self: start; }
  .bottom-nav .nav-plus { justify-self: center; }
  .bottom-nav .nav-item:nth-child(4) { justify-self: end; }
  .bottom-nav .nav-item:nth-child(5) { justify-self: start; }
  .bottom-nav .nav-item {
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.6);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    position: relative;
    padding: 0 4px;
  }
  .bottom-nav .nav-item:nth-child(4) {
    margin-right: 22px;
  }
  .bottom-nav .nav-item.active {
    color: #fff;
  }
  .bottom-nav .nav-item .nav-swap-icon {
    display: inline-flex;
    align-items: center;
    margin-left: 2px;
    opacity: 0.9;
  }
  .bottom-nav .nav-item .nav-swap-icon svg {
    display: block;
    width: 14px;
    height: 14px;
  }
  .bottom-nav .nav-item .nav-badge {
    position: absolute;
    top: -6px;
    right: -10px;
    background: #fe2c55;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    min-width: 18px;
    height: 18px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
  }
  .bottom-nav .nav-plus {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bottom-nav .plus-btn {
    width: 40px;
    height: 28px;
    border-radius: 8px;
    border: 2px solid #fff;
    color: #fff;
    font-size: 20px;
    font-weight: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .side-actions {
    position: absolute;
    right: 10px;
    bottom: 70px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    z-index: 2;
  }
  .side-action {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: #fff;
  }

  /* 音乐唱片 */
  .disc-container {
    position: relative;
    width: 36px;
    height: 36px;
  }
  .disc-outer {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    overflow: hidden;
    position: relative;
  }
  .disc-cover {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    z-index: 2;
  }
  .disc-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    border-radius: 50%;
  }
  .disc-default {
    color: #888;
    font-size: 14px;
    line-height: 44px;
    text-align: center;
    width: 100%;
    height: 100%;
  }
  .disc-center {
    display: none;
  }
  .side-action .icon {
    width: 35px;
    height: 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    background: none;
  }
  .side-action .count { font-size: 11px; font-weight: 500; }
  .side-action.avatar .icon { 
    background: #fff; 
    padding: 2px; 
    width: 40px;
    height: 40px;
    font-size: 18px;
  }
  .side-action.music-disc .disc-container {
    width: 36px;
    height: 36px;
  }
  .side-action.music-disc .disc-outer {
    width: 36px;
    height: 36px;
  }

  /* 评论区面板 */
  .comment-panel {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 62%;
    background: #fff;
    border-radius: 16px 16px 0 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .comment-header {
    padding: 12px 16px 10px;
    position: relative;
    border-bottom: 1px solid #f5f5f5;
    flex-shrink: 0;
  }
  .search-row {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
  }
  .search-label {
    font-size: 13px;
    color: #333;
    flex-shrink: 0;
    font-weight: 600;
  }
  .search-keyword {
    font-size: 13px;
    color: #3668b3;
    margin-left: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 160px;
    font-weight: 600;
  }
  .search-icon {
    width: 14px;
    height: 14px;
    color: #666;
    margin-left: 2px;
    flex-shrink: 0;
  }
  .header-right-icons {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  .fullscreen-btn {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #333;
    cursor: pointer;
    background: #f5f5f5;
    border-radius: 50%;
    margin-right: 10px;
  }
  .fullscreen-btn svg {
    width: 18px;
    height: 18px;
    stroke-width: 2.5;
  }
  .comment-header .close-btn {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #333;
    font-size: 20px;
    line-height: 1;
    font-weight: 600;
    background: #f5f5f5;
    border-radius: 50%;
  }
  .comment-count {
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    color: #161823;
  }
  .comment-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0 8px;
  }
  .comment-list::-webkit-scrollbar { width: 0; }

  /* 单条评论 - 按参考图设计 */
  .comment-item {
    display: flex;
    padding: 12px 16px;
    gap: 12px;
    position: relative;
  }
  .comment-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    flex-shrink: 0;
    overflow: hidden;
    background: #eee;
  }
  .comment-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .comment-body { flex: 1; min-width: 0; }
  .comment-username {
    font-size: 14px;
    color: #999;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .badge {
    font-size: 10px;
    padding: 1px 4px;
    border-radius: 3px;
    font-weight: 500;
    line-height: 1.2;
  }
  .badge-first {
    background: #fff0f0;
    color: #fe2c55;
    font-weight: bold;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 11px;
    line-height: 1.3;
    display: inline-block;
    vertical-align: middle;
    margin-left: 4px;
  }
  .badge-author {
    background: #fe2c55;
    color: #fff;
    font-weight: bold;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 10px;
    line-height: 1.5;
    display: inline-block;
    vertical-align: middle;
    height: 16px;
    display: inline-flex;
    align-items: center;
  }
  .badge-fan {
    background: #f0f0f0;
    color: #666;
    font-weight: 500;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 10px;
    line-height: 1.5;
    display: inline-block;
    vertical-align: middle;
    height: 16px;
    display: inline-flex;
    align-items: center;
  }
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tag {
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
    font-weight: 500;
    line-height: 1.4;
  }
  .tag-author { background: #fe2c55; color: #fff; }
  .tag-pin { background: #fff0f0; color: #fe2c55; border: 1px solid #ffd6dd; font-size: 9px; padding: 0 4px; line-height: 1; height: 15px; display: inline-flex; align-items: center; box-sizing: border-box; }
  .comment-text {
    font-size: 14px;
    color: #1a1a1a;
    line-height: 1.5;
    word-break: break-word;
    font-weight: 400;
    margin-bottom: 6px;
  }
  .comment-text .mention-link {
    color: #507daf;
    cursor: pointer;
  }
  .comment-text .mention-link:hover {
    text-decoration: underline;
  }
  .comment-img {
    margin-bottom: 8px;
  }
  .comment-img img {
    max-width: 120px;
    max-height: 120px;
    width: auto;
    height: auto;
    border-radius: 4px;
    object-fit: cover;
    display: block;
  }
  .comment-footer {
    display: flex;
    align-items: center;
    gap: 10px;
    white-space: nowrap;
    flex-wrap: nowrap;
  }
  .comment-meta-left {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .comment-time { font-size: 13px; color: #999; }
  .comment-location { font-size: 13px; color: #999; }
  .meta-dot { color: #ddd; font-size: 12px; }

<script>
  const avatarColors = [
    ['#fe2c55', '#ff6b8a'], ['#ff9500', '#ffb347'], ['#00b894', '#55efc4'],
    ['#0984e3', '#74b9ff'], ['#6c5ce7', '#a29bfe'], ['#e84393', '#fd79a8'],
    ['#00cec9', '#81ecec'], ['#fdcb6e', '#ffeaa7'], ['#e17055', '#fab1a0'],
    ['#2d3436', '#636e72']
  ];

  let _currentAvatarImg = '';

  // 心形SVG（空心）
  const HEART_SVG = '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
  // 破碎心形SVG（空心+裂缝）
  const BROKEN_HEART_SVG = '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/><path d="M12 4.5l-2.5 4.5h3l-2 4 3.5-2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  // 完全破裂心形SVG（灰色实心+闪电裂缝，点击后显示）
  const BROKEN_HEART_FULL_SVG = '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#999"/><path d="M12 5.5 L10 9 L13 12 L10.5 15.5 L13 18.5 L12 21" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  // 向下箭头（^形状细线条）
  const ARROW_DOWN_SVG = '<svg width="10" height="8" viewBox="0 0 10 8"><path d="M1 1 L5 7 L9 1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  // 向上箭头（^形状细线条）
  const ARROW_UP_SVG = '<svg width="10" height="8" viewBox="0 0 10 8"><path d="M1 7 L5 1 L9 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const presets = {
    good: [
      { username: '已买等收货', content: '刚下单！期待效果，到了来追评～', likes: 234, dislikes: 2, time: '2小时前', location: '广东' },
      { username: '用了三天', content: '真的有用！我是敏感肌也没过敏，已经推荐给闺蜜了', likes: 1892, dislikes: 5, time: '5小时前', location: '浙江' },
      { username: '回购第三次', content: '老粉了，每次活动都囤，性价比真的高', likes: 567, dislikes: 1, time: '1天前', location: '四川' }
    ],
    question: [
      { username: '纠结星人', content: '请问油皮适合吗？会不会闷痘？', likes: 45, dislikes: 0, time: '30分钟前', location: '北京' },

    ],
    want: [
      { username: '被种草了', content: '求链接！找了好久这种的', likes: 156, dislikes: 3, time: '3小时前', location: '湖北' },

      { username: '成分党本党', content: '看了成分表很良心，这个价位能有这个配置真的少见', likes: 876, dislikes: 2, time: '12小时前', location: '山东' }
    ],

      { username: '跟着买的', content: '看博主推荐买的，果然没踩雷，已经是第二次买了', likes: 432, dislikes: 1, time: '2天前', location: '河南' }
    ],
    author_reply: [
      { username: '好物分享官', content: '谢谢姐妹支持！有任何问题随时找客服哦～', likes: 567, dislikes: 0, time: '4小时前', location: '广东', author: true }
    ]
  };

  let comments = [];

  let nextId = 100;

  function makeAvatar(color, text, imgSrc) {
    if (imgSrc) {
      return '<div class="comment-avatar"><img src="' + imgSrc + '" style="width:100%;height:100%;object-fit:cover;"></div>';
    }
    const initial = (text || '?').charAt(0).toUpperCase();
    const c = color || avatarColors[Math.floor(Math.random() * avatarColors.length)];
    return '<div class="comment-avatar"><div style="width:100%;height:100%;background:linear-gradient(135deg,' + c[0] + ',' + c[1] + ');display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:600;">' + initial + '</div></div>';
  }

  function formatCount(n) {
    if (n >= 10000) return (n / 10000).toFixed(1) + '万';
    return n.toString();
  }

  // 把文本中的@用户名替换为蓝色链接
  function renderMentionLinks(text) {
    if (!text) return '';
    return text.replace(/@([^\s@]+)/g, '<span class="mention-link">@$1</span>');
  }

  // 渲染操作按钮（点赞+心碎并排）
  function renderActionButtons(likes, dislikes, commentId) {
    return '<div class="action-buttons">' +
      '<div class="action-btn" onclick="toggleLike(this, ' + likes + ', ' + commentId + ')">' +
        '<div class="icon-wrap">' + HEART_SVG + '</div>' +
        '<span class="count">' + formatBigNum(likes) + '</span>' +
      '</div>' +
      '<div class="action-btn" onclick="toggleDislike(this, ' + dislikes + ', ' + commentId + ')">' +
        '<div class="icon-wrap">' + BROKEN_HEART_SVG + '</div>' +
        '<span class="count">' + formatBigNum(dislikes) + '</span>' +
      '</div>' +
    '</div>';
  }

  function renderComment(c) {
    const colorIdx = Math.abs(hashCode(c.username)) % avatarColors.length;
    const color = avatarColors[colorIdx];
    const tags = [];
    if (c.pin) tags.push('<span class="tag tag-pin">置顶</span>');
    if (c.author) tags.push('<span class="badge badge-author">作者</span>');

    // 地点显示
    const locationHtml = c.location ? '<span class="meta-dot">·</span><span class="comment-location">' + c.location + '</span>' : '';

    let repliesHtml = '';
    if (c.replies && c.replies.length > 0) {
      const totalReplies = c.replies.length;
      const replyItems = c.replies.map(function(r) {
        const rc = avatarColors[Math.abs(hashCode(r.username)) % avatarColors.length];
        const rLocationHtml = r.location ? '<span class="meta-dot">·</span><span class="comment-location">' + r.location + '</span>' : '';
        const replyToHtml = r.replyTo ? '<span style="color:#bbb;margin:0 2px;">▶</span><span style="color:#999;">' + r.replyTo + '</span>' : '';
        return '<div class="reply-item">' +
          '<button class="delete-btn" onclick="deleteReply(' + c.id + ', ' + r.id + ')">删除</button>' +
          makeAvatar(rc, r.username, r.avatarImg) +
          '<div class="comment-body">' +
            '<div class="comment-username">' + r.username +
              (r.author ? '<span class="badge badge-author">作者</span>' : '') +
              (r.isFan ? '<span class="badge badge-fan">粉丝</span>' : '') +
              replyToHtml +
            '</div>' +
            '<div class="comment-text">' + renderMentionLinks(r.content) + '</div>' +
            '<div class="comment-footer">' +
              '<div class="comment-meta-left">' +
                '<span class="comment-time"' + (r.timeTs ? ' data-ts="' + r.timeTs + '"' : '') + '>' + (r.timeTs ? fmtDynamicTime(r.timeTs) : (r.time || '刚刚')) + '</span>' +
                rLocationHtml +
                '<button class="reply-btn" onclick="showReplyInput(' + c.id + ', this, \'' + r.username.replace(/'/g, "\\'") + '\')">回复</button>' +
              '</div>' +
              renderActionButtons(r.likes || 0, r.dislikes || 0, r.id) +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');

      // 底部操作栏：超过3条时有"展开更多"，否则只有"收起"
      const hasMore = totalReplies > 3;
      const footerHtml = '<div class="reply-footer">' +
        (hasMore ? '<span class="expand-more-btn" onclick="expandMoreReplies(this, ' + c.id + ')"><span>展开更多</span><span class="arrow arrow-down">' + ARROW_DOWN_SVG + '</span></span>' : '') +
        '<span class="collapse-btn" onclick="collapseReplies(this, ' + c.id + ')"><span>收起</span><span class="arrow arrow-up">' + ARROW_UP_SVG + '</span></span>' +
      '</div>';

      repliesHtml = '<div class="reply-section" data-comment-id="' + c.id + '">' +
        // 未展开时的按钮
        '<div class="reply-toggle" onclick="toggleReplies(this, ' + c.id + ')">' +
          '<span class="toggle-text">展开' + totalReplies + '条回复</span>' +
          '<span class="arrow arrow-down">' + ARROW_DOWN_SVG + '</span>' +
        '</div>' +
        // 展开后的内容（默认隐藏）
        '<div class="reply-list-wrap" style="display:none;">' +
          '<div class="reply-items">' + replyItems + '</div>' +
          footerHtml +
        '</div>' +
      '</div>';
    }

    return '<div class="comment-item" data-id="' + c.id + '">' +
      '<button class="delete-btn" onclick="deleteComment(' + c.id + ')">删除</button>' +
      makeAvatar(color, c.username, c.avatarImg) +
      '<div class="comment-body">' +
        '<div class="comment-username">' + c.username + tags.join('') + '</div>' +
        '<div class="comment-text">' + renderMentionLinks(c.content) + (c.firstComment ? ' <span class="badge badge-first">首评</span>' : '') + '</div>' +
        (c.img ? '<div class="comment-img"><img src="' + c.img + '"></div>' : '') +
        '<div class="comment-footer">' +
          '<div class="comment-meta-left">' +
            '<span class="comment-time"' + (c.timeTs ? ' data-ts="' + c.timeTs + '"' : '') + '>' + (c.timeTs ? fmtDynamicTime(c.timeTs) : (c.time || '刚刚')) + '</span>' +
            locationHtml +
            '<button class="reply-btn" onclick="showReplyInput(' + c.id + ', this)">回复</button>' +
          '</div>' +
          renderActionButtons(c.likes, c.dislikes || 0, c.id) +
        '</div>' +
        repliesHtml +
      '</div>' +
    '</div>';
  }

  function hashCode(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      hash = ((hash << 5) - hash) + str.charCodeAt(i);
      hash |= 0;
    }
    return hash;
  }

  function renderComments() {
    const list = document.getElementById('commentList');
    if (comments.length === 0) {
      list.innerHTML = '<div class="empty-state">暂无评论，快来添加第一条吧～</div>';
    } else {
      const sorted = comments.slice().sort(function(a, b) {
        if (b.pin !== a.pin) return (b.pin ? 1 : 0) - (a.pin ? 1 : 0);
        return (b.likes || 0) - (a.likes || 0);
      });
      list.innerHTML = sorted.map(renderComment).join('');
    }
    const total = comments.reduce(function(sum, c) { return sum + 1 + (c.replies ? c.replies.length : 0); }, 0);
    document.getElementById('commentTitle').textContent = total + '条评论';
    document.getElementById('totalCount').textContent = formatCount(total);
    saveComments();
  }

  // ===== 自动记忆（localStorage） =====
  const SAVE_IDS = ['inputUsername','inputAvatar','inputContent','inputTimeNum','inputTimeUnit','inputCountry','inputProvince','inputLikes','inputDislikes','inputAuthor','inputFirst','inputPin','inputSearchKeyword','replyNickname','replyLikes','replyDislikes','replyTimeNum','replyTimeUnit','replyCountry','replyProvince','replyBadge','inputVideoAuthor','inputVideoDesc','inputLikeCount','inputCollectCount','inputShareCount','inputMsgCount','settingVideo','settingSide'];

  function saveComments() {
    if (!isMemoryOn()) return;
    try {
      localStorage.setItem('dy_mock_comments', JSON.stringify(comments));
    } catch (e) {}
  }

  function saveState() {
    if (!isMemoryOn()) return;
    try {
      var state = { values: {} };
      SAVE_IDS.forEach(function(id) {
        var el = document.getElementById(id);
        if (!el) return;
        if (el.type === 'checkbox') state.values[id] = el.checked;
        else state.values[id] = el.value;
      });
      var bgImg = document.getElementById('videoBgImg');
      var bgVideo = document.getElementById('videoBgVideo');
      var vaImg = document.getElementById('videoAvatarImg');
      var rpPreview = document.getElementById('replyAvatarPreview');
      var disc = document.getElementById('musicDiscImg');
      if (bgImg && bgImg.src && bgImg.src.indexOf('data:') === 0) state.videoBgImgSrc = bgImg.src;
      if (bgVideo && bgVideo.src && bgVideo.src.indexOf('data:') === 0) state.videoBgVideoSrc = bgVideo.src;
      if (vaImg && vaImg.src && vaImg.src.indexOf('data:') === 0) state.videoAvatarSrc = vaImg.src;
      if (rpPreview && rpPreview.querySelector('img')) {
        var s = rpPreview.querySelector('img').src;
        if (s.indexOf('data:') === 0) state.replyAvatarSrc = s;
      }
      if (disc && disc.src && disc.src.indexOf('data:') === 0) state.discSrc = disc.src;
      state.currentLikeNum = currentLikeNum;
      state.currentCollectNum = currentCollectNum;
      state.videoLiked = videoLiked;
      state.videoCollected = videoCollected;
      localStorage.setItem('dy_mock_state', JSON.stringify(state));
    } catch (e) {}
  }

  function loadState() {
    if (!isMemoryOn()) return;
    try {
      var raw = localStorage.getItem('dy_mock_state');
      if (!raw) return;
      var state = JSON.parse(raw);
      SAVE_IDS.forEach(function(id) {
        var el = document.getElementById(id);
        if (!el || !(id in state.values)) return;
        if (el.type === 'checkbox') el.checked = state.values[id];
        else el.value = state.values[id];
      });
      if (typeof updateProvinces === 'function') {
        updateProvinces('input');
        updateProvinces('reply');
      }
      if (typeof toggleVideoBg === 'function') toggleVideoBg();
      if (typeof toggleSideActions === 'function') toggleSideActions();
      if (typeof updateSearchKeyword === 'function') updateSearchKeyword();
      if (typeof updateVideoAuthor === 'function') updateVideoAuthor();
      if (typeof updateVideoDesc === 'function') updateVideoDesc();
      if (typeof updateLikeCount === 'function') updateLikeCount();
      if (typeof updateCollectCount === 'function') updateCollectCount();
      if (typeof updateShareCount === 'function') updateShareCount();
      if (typeof updateMsgCount === 'function') updateMsgCount();
      currentLikeNum = state.currentLikeNum || 0;
      currentCollectNum = state.currentCollectNum || 0;
      videoLiked = state.videoLiked || false;
      videoCollected = state.videoCollected || false;
      var bgImg = document.getElementById('videoBgImg');
      var bgVideo = document.getElementById('videoBgVideo');
      var playIcon = document.getElementById('videoPlayIcon');
      if (state.videoBgVideoSrc && bgVideo) {
        bgVideo.src = state.videoBgVideoSrc;
        bgVideo.style.display = 'block';
        bgImg.style.display = 'none';
        playIcon.style.display = 'none';
        bgVideo.addEventListener('loadeddata', function() {
          setTimeout(function() {
            var canvas = document.createElement('canvas');
            canvas.width = bgVideo.videoWidth;
            canvas.height = bgVideo.videoHeight;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(bgVideo, 0, 0);
            var discImg = document.getElementById('musicDiscImg');
            var defaultDisc = document.getElementById('musicDiscDefault');
            discImg.src = canvas.toDataURL('image/jpeg', 0.6);
            discImg.style.display = 'block';
            defaultDisc.style.display = 'none';
          }, 200);
        });
      } else if (state.videoBgImgSrc && bgImg) {
        bgImg.src = state.videoBgImgSrc;
        bgImg.style.display = 'block';
        bgVideo.style.display = 'none';
        playIcon.style.display = 'none';
      }
      if (state.videoAvatarSrc) {
        var vaImg = document.getElementById('videoAvatarImg');
        var vaDefault = document.getElementById('videoAvatarDefault');
        vaImg.src = state.videoAvatarSrc;
        vaImg.style.display = 'block';
        vaDefault.style.display = 'none';
      }
      if (state.replyAvatarSrc) {
        replyAvatarImg = state.replyAvatarSrc;
        var rpPreview = document.getElementById('replyAvatarPreview');
        rpPreview.innerHTML = '<img src="' + replyAvatarImg + '" style="width:100%;height:100%;object-fit:cover;">';
      }
      if (state.discSrc) {
        var discImg = document.getElementById('musicDiscImg');
        var defaultDisc = document.getElementById('musicDiscDefault');
        discImg.src = state.discSrc;
        discImg.style.display = 'block';
        defaultDisc.style.display = 'none';
      }
    } catch (e) {}
  }

  function loadComments() {
    if (!isMemoryOn()) return;
    try {
      var raw = localStorage.getItem('dy_mock_comments');
      if (!raw) return;

          (c.replies || []).forEach(function(r) { if (r.id >= nextId) nextId = r.id + 1; });
        });

    } catch (e) {}

  // 通用：多张图片压缩后依次填入槽位（从 startIndex 起，最多 5 槽），setCurrent 指定设为当前头像的槽
  function handlePresetFiles(files, startIndex, setCurrent) {
    var saved = loadPreset();
    var total = files.length;
    var done = 0;
    for (var k = 0; k < total; k++) {
      (function(k) {
        var file = files[k];
        var reader = new FileReader();
        reader.onload = function(ev) {
          var img = new Image();
          img.onload = function() {
            var size = 160;
            var canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            var ctx = canvas.getContext('2d');
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, size, size);
            ctx.drawImage(img, 0, 0, size, size);
            var dataUrl = canvas.toDataURL('image/jpeg', 0.85);
            var idx = startIndex + k;
            if (idx >= 0 && idx < 5) saved[idx] = dataUrl;
            done++;
            if (done === total) {
              savePreset(saved);
              renderPresetAvatars();
              if (setCurrent >= 0 && saved[setCurrent]) {
                _currentAvatarImg = saved[setCurrent];
                document.getElementById('avatarPreviewImg').src = saved[setCurrent];
                document.getElementById('avatarPreviewBox').classList.add('show');
                document.getElementById('avatarFile').value = '';
                document.getElementById('inputAvatar').value = '预设头像' + (setCurrent + 1);
                document.querySelectorAll('#presetAvatars .preset-slot').forEach(function(s) { s.classList.remove('selected'); });
                document.querySelectorAll('#presetAvatars .preset-slot')[setCurrent].classList.add('selected');
              }
            }
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      })(k);
    }
  }

  function findCommentById(id) {
    for (let i = 0; i < comments.length; i++) {
      if (comments[i].id === id) return comments[i];
      if (comments[i].replies) {
        for (let j = 0; j < comments[i].replies.length; j++) {
          if (comments[i].replies[j].id === id) return comments[i].replies[j];
        }
      }
    }
    return null;
  }

  function toggleLike(el, baseCount, commentId) {

    } else {
      el.classList.add('liked');
      comment.likes = baseCount + 1;
      // 点赞时取消心碎
      const dislikeBtn = el.parentElement.querySelector('.action-btn:nth-child(2)');
      if (dislikeBtn && dislikeBtn.classList.contains('disliked')) {
        dislikeBtn.classList.remove('disliked');
        comment.dislikes = Math.max(0, (comment.dislikes || 0) - 1);
        dislikeBtn.querySelector('.count').textContent = formatBigNum(comment.dislikes);

  // ===== 通用表情选择器（评论设置-评论内容 / 评论区回复输入框） =====
  function renderEpGrid(picker, cat) {
    var cats = Object.keys(EMOJI_DATA);
    var html = '<div class="ep-cats">';
    cats.forEach(function(c) {
      html += '<span class="ep-cat' + (c === cat ? ' active' : '') + '" data-cat="' + c + '">' + EMOJI_DATA[c][0] + '</span>';
    });
    html += '</div><div class="ep-grid">';
    EMOJI_DATA[cat].forEach(function(e) {
      html += '<span class="ep-item" data-emoji="' + e + '">' + e + '</span>';
    });
    html += '</div>';
    picker.innerHTML = html;
    picker.onclick = function(ev) {
      var item = ev.target.closest('.ep-item');
      if (item) {
        var input = picker._input;
        if (input) insertAtCursor(input, item.getAttribute('data-emoji'));
        return;
      }
      var catEl = ev.target.closest('.ep-cat');
      if (catEl) {
        renderEpGrid(picker, catEl.getAttribute('data-cat'));
      }
    };
  }

  function insertAtCursor(el, text) {
    var start = el.selectionStart != null ? el.selectionStart : (el.value || '').length;
    var end = el.selectionEnd != null ? el.selectionEnd : start;
    var v = el.value || '';
    var before = v.substring(0, start);
    var after = v.substring(end);
    var max = parseInt(el.getAttribute('maxlength')) || 100000;
    var newVal = before + text + after;
    if (newVal.length > max) newVal = newVal.substring(0, max);
    el.value = newVal;
    var pos = before.length + text.length;
    el.focus();
    try { el.setSelectionRange(pos, pos); } catch (e) {}
    if (el.id === 'inputContent') updateCommentCount();
  }

  // 视频背景上传
  function handleVideoBgUpload(event, type) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = document.getElementById('videoBgImg');
      const video = document.getElementById('videoBgVideo');
      const playIcon = document.getElementById('videoPlayIcon');
      const input = document.getElementById('inputVideoBg');
      if (type === 'image') {
        img.src = e.target.result;
        img.style.display = 'block';
        video.style.display = 'none';
        video.pause();
        playIcon.style.display = 'none';
        input.value = file.name;
      } else {
        video.src = e.target.result;
        video.style.display = 'block';
        img.style.display = 'none';
        playIcon.style.display = 'none';
        video.muted = false;
        video.play();
        input.value = file.name;
        
        // 截取视频第一帧作为音乐盒封面
        video.addEventListener('loadeddata', function() {
          setTimeout(function() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const frameUrl = canvas.toDataURL('image/png');
            // 设置音乐盒封面
            const discImg = document.getElementById('musicDiscImg');
            const defaultDisc = document.getElementById('musicDiscDefault');
            if (discImg) {
              discImg.src = frameUrl;
              discImg.style.display = 'block';
              if (defaultDisc) defaultDisc.style.display = 'none';
            }
            // 音乐盒默认播放状态，添加旋转动画
            const discContainer = document.querySelector('.disc-container');
            const muteOverlay = document.getElementById('muteOverlay');
            if (discContainer) discContainer.classList.add('playing');
            if (muteOverlay) muteOverlay.style.display = 'none';
          }, 100);
        });
      }
    };
    reader.readAsDataURL(file);
  }

  // 视频播放进度
  let videoPlaying = false;

  function formatTime(seconds) {
    if (!seconds || isNaN(seconds)) return '00:00';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function updateProgressUI() {
    const video = document.getElementById('videoBgVideo');
    const progressBar = document.getElementById('videoProgressBar');
    if (!video || !video.src || video.style.display === 'none') {
      progressBar.classList.remove('visible');
      return;
    }
    const currentTime = video.currentTime || 0;
    const duration = video.duration || 0;
    const percent = duration > 0 ? (currentTime / duration) * 100 : 0;
    const progressFill = document.getElementById('progressFill');
    const progressThumb = document.getElementById('progressThumb');
    if (progressFill) progressFill.style.width = percent + '%';
    if (progressThumb) progressThumb.style.left = percent + '%';
  }

  function showProgressBar() {
    const progressBar = document.getElementById('videoProgressBar');
    const video = document.getElementById('videoBgVideo');
    if (video && video.src && video.style.display !== 'none') {

  // 视频播放/暂停切换
  function toggleVideoPlay() {
    const video = document.getElementById('videoBgVideo');
    const playIcon = document.getElementById('videoPlayIcon');
    // 如果没有视频背景，不做处理
    if (video.style.display === 'none' || !video.src) return;
    if (videoPlaying) {
      video.pause();
      playIcon.style.display = 'block';
      videoPlaying = false;
      showProgressBar();
    } else {
      video.play();
      playIcon.style.display = 'none';
      videoPlaying = true;
      hideProgressBar();
    }
  }

  // 视频事件监听
  document.addEventListener('DOMContentLoaded', function() {
    const video = document.getElementById('videoBgVideo');
    const progressBar = document.getElementById('videoProgressBar');
    const track = document.querySelector('.progress-track');
    let isDragging = false;

    // 视频时间更新
    video.addEventListener('timeupdate', function() {
      if (!isDragging) {
        if (videoPlaying) {
          // 播放时不显示进度条，但更新数据
        } else {
          updateProgressUI();
        }
      }
    });

    // 视频元数据加载完成
    video.addEventListener('loadedmetadata', function() {
      updateProgressUI();
    });

    // 计算进度百分比
    function getPercent(e) {
      const rect = track.getBoundingClientRect();
      let clientX;
      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
      } else if (e.changedTouches && e.changedTouches.length > 0) {
        clientX = e.changedTouches[0].clientX;
      } else {
        clientX = e.clientX;
      }
      let percent = (clientX - rect.left) / rect.width;
      percent = Math.max(0, Math.min(1, percent));
      return percent;
    }

    // 拖拽开始
    function startDrag(e) {
      const video = document.getElementById('videoBgVideo');
      if (!video || !video.src || !video.duration) return;
      isDragging = true;
      e.preventDefault();
      const percent = getPercent(e);
      video.currentTime = percent * video.duration;
      updateProgressUI();
    }

    // 拖拽中
    function onDrag(e) {
      if (!isDragging) return;
      const video = document.getElementById('videoBgVideo');
      if (!video || !video.src || !video.duration) return;
      e.preventDefault();
      const percent = getPercent(e);
      video.currentTime = percent * video.duration;
      updateProgressUI();
    }

    // 拖拽结束
    function endDrag(e) {
      if (isDragging) {
        isDragging = false;
      }
    }

    // 鼠标事件
    if (track) {
      track.addEventListener('mousedown', startDrag);
      document.addEventListener('mousemove', onDrag);
      document.addEventListener('mouseup', endDrag);
    }

    // 触摸事件
    if (track) {
      track.addEventListener('touchstart', startDrag, { passive: false });
      document.addEventListener('touchmove', onDrag, { passive: false });
      document.addEventListener('touchend', endDrag);
    }

    // 初始隐藏进度条
    hideProgressBar();
    // 初始化渲染文案（含#标签加粗）
    const initialDesc = document.getElementById('inputVideoDesc').value;
    renderDesc(initialDesc);
  });

  // 保存原始文案
  let originalDescText = '';

  // 检查文案长度，判断是否需要展开按钮
  function checkDescLength() {
    const desc = document.getElementById('videoDesc');
    const toggle = document.getElementById('descToggle');
    const wrapper = document.querySelector('.desc-wrapper');
    if (!desc || !toggle || !wrapper) return;
    
    // 保存原始文案（此时desc.innerHTML一定是完整原始文案）
    originalDescText = desc.innerHTML;
    const plainText = desc.textContent;
    
    // 向下箭头SVG
    const arrowDown = '<svg width="10" height="8" viewBox="0 0 10 8" style="margin-left:2px;display:inline;vertical-align:middle;"><path d="M1 1 L5 7 L9 1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const expandBtnHtml = '<span style="color:#fff;font-weight:700;cursor:pointer;" onclick="toggleDesc()">... 展开' + arrowDown + '</span>';
    
    // 先让wrapper显示完整文案，测量高度
    wrapper.style.height = 'auto';
    wrapper.style.overflow = 'visible';
    toggle.style.display = 'none';
    desc.innerHTML = originalDescText;
    
    // 创建临时元素测量两行高度
    const lineHeight = parseFloat(getComputedStyle(desc).lineHeight);
    const twoLineHeight = lineHeight * 2;
    
    // 如果超过两行高度
    if (wrapper.offsetHeight > twoLineHeight + 1) {
      // 计算截断位置：逐字减少，直到高度小于等于两行（包含展开按钮）
      let truncated = plainText;
      // 先把展开按钮加上，一起测量
      desc.innerHTML = truncated.replace(/#([^#\s]+)/g, '<span style="font-weight:700;">#$1</span>') + expandBtnHtml;
      
      while (truncated.length > 10 && wrapper.offsetHeight > twoLineHeight + 1) {
        truncated = truncated.slice(0, -1);
        desc.innerHTML = truncated.replace(/#([^#\s]+)/g, '<span style="font-weight:700;">#$1</span>') + expandBtnHtml;
      }
      // 多截断两个中文字符
      truncated = truncated.slice(0, -2);
      desc.innerHTML = truncated.replace(/#([^#\s]+)/g, '<span style="font-weight:700;">#$1</span>') + expandBtnHtml;
      toggle.style.display = 'none';
      wrapper.classList.add('collapsed');
    } else {
      // 不需要截断，恢复原始文案
      desc.innerHTML = originalDescText;
      wrapper.classList.remove('collapsed');
      toggle.style.display = 'none';
    }
  }

  // 切换展开/收起
  function toggleDesc() {
    const desc = document.getElementById('videoDesc');
    const wrapper = document.querySelector('.desc-wrapper');
    
    // 向上箭头SVG
    const arrowUp = '<svg width="10" height="8" viewBox="0 0 10 8" style="margin-left:2px;display:inline;vertical-align:middle;"><path d="M1 7 L5 1 L9 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    
    if (wrapper.classList.contains('collapsed')) {
      // 展开：显示完整文案 + 收起按钮
      let html = originalDescText + ' <span style="color:#fff;font-weight:700;cursor:pointer;" onclick="toggleDesc()">收起' + arrowUp + '</span>';
      desc.innerHTML = html;
      wrapper.classList.remove('collapsed');
    } else {
      // 收起：先恢复成原始文案，再重新计算截断
      desc.innerHTML = originalDescText;
      checkDescLength();
    }
  }

  function formatBigNum(num) {

  function updateSearchKeyword() {
    const val = document.getElementById('inputSearchKeyword').value.trim();
    document.getElementById('searchKeyword').textContent = val || '谁家的牌子好用';
  }

  // ===== 底部输入栏功能 =====
  let _bottomImg = '';

  function toggleSendBtn() {
    const input = document.getElementById('bottomInput');
    const btn = document.getElementById('sendBtnInline');
    if (btn) {
      btn.style.display = (input.value.trim() || _bottomImg) ? 'block' : 'none';
    }
  }

  // 回复头像上传
  let replyAvatarImg = '';
  function handleReplyAvatarUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      replyAvatarImg = ev.target.result;
      const preview = document.getElementById('replyAvatarPreview');
      preview.innerHTML = '<img src="' + replyAvatarImg + '" style="width:100%;height:100%;object-fit:cover;">';
    };
    reader.readAsDataURL(file);
  }

  function submitBottomComment() {
    const input = document.getElementById('bottomInput');
    const content = input.value.trim();
    if (!content && !_bottomImg) return;

    // 引用左侧面板参数
    const username = document.getElementById('inputUsername').value.trim() || '我';
    const likes = parseInt(document.getElementById('inputLikes').value) || 0;
    const dislikes = parseInt(document.getElementById('inputDislikes').value) || 0;
    const timeNum = document.getElementById('inputTimeNum').value.trim();
    const timeUnit = document.getElementById('inputTimeUnit').value;
    const time = timeNum ? (timeNum + timeUnit) : '刚刚';
    const timeTs = timeNum ? null : Date.now();
    const inputProvince = document.getElementById('inputProvince').value;
    const location = inputProvince || '';
    const author = document.getElementById('inputAuthor').checked;
    const firstComment = document.getElementById('inputFirst').checked;
    const avatarImg = _currentAvatarImg;

    comments.push({
      id: nextId++,
      username: username,
      content: content,
      img: _bottomImg || '',
      likes: likes,
      dislikes: dislikes,
      time: time,
      timeTs: timeTs,
      location: location,
      author: author,
      firstComment: firstComment,
      pin: document.getElementById('inputPin').checked,
      avatarImg: avatarImg,
      replies: []
    });

    renderComments();
    input.value = '';
    removeBottomImg();
    closeMentionPanel();
    document.getElementById('emojiPanel').style.display = 'none';
    commentInputBar.classList.remove('focused');
    input.blur();
    toggleSendBtn();
  }

  function handleBottomImgUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      _bottomImg = ev.target.result;
      document.getElementById('bottomImgPreviewImg').src = ev.target.result;
      document.getElementById('bottomImgPreview').style.display = 'inline-block';
      toggleSendBtn();
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  }

  function removeBottomImg() {
    _bottomImg = '';
    document.getElementById('bottomImgPreview').style.display = 'none';
    document.getElementById('bottomImgPreviewImg').src = '';
    toggleSendBtn();
  }

  // @人面板
  function toggleMentionPanel() {
    const panel = document.getElementById('mentionPanel');
    const emojiPanel = document.getElementById('emojiPanel');
    const inputContainer = document.querySelector('.input-container');
    const imgPreview = document.getElementById('bottomImgPreview');
    if (panel.style.display === 'none') {
      panel.style.display = 'block';
      emojiPanel.style.display = 'none';
      inputContainer.style.display = 'none';
      imgPreview.style.display = 'none';
      renderMentionUsers();
      setTimeout(function() { document.getElementById('mentionSearch').focus(); }, 50);
    } else {
      closeMentionPanel();
    }
  }

  function closeMentionPanel() {
    const panel = document.getElementById('mentionPanel');
    const inputContainer = document.querySelector('.input-container');
    const imgPreview = document.getElementById('bottomImgPreview');
    panel.style.display = 'none';
    inputContainer.style.display = 'flex';
    if (_bottomImg) imgPreview.style.display = 'inline-block';
    document.getElementById('mentionSearch').value = '';
  }

  function renderMentionUsers(filter) {
    const container = document.getElementById('mentionUsers');
    // 收集所有评论中的用户（去重）
    const userMap = {};
    comments.forEach(function(c) {
      if (!userMap[c.username]) {
        userMap[c.username] = { username: c.username, avatarImg: c.avatarImg || '' };
      }
      if (c.replies) {
        c.replies.forEach(function(r) {
          if (!userMap[r.username]) {
            userMap[r.username] = { username: r.username, avatarImg: r.avatarImg || '' };
          }
        });
      }
    });
    let users = Object.values(userMap);
    if (filter) {
      users = users.filter(function(u) { return u.username.indexOf(filter) >= 0; });
    }
    container.innerHTML = users.map(function(u) {
      const colorIdx = Math.abs(hashCode(u.username)) % avatarColors.length;
      const color = avatarColors[colorIdx];
      const initial = u.username.charAt(0).toUpperCase();
      const avatarHtml = u.avatarImg
        ? '<div class="mention-avatar"><img src="' + u.avatarImg + '"></div>'
        : '<div class="mention-avatar" style="background:linear-gradient(135deg,' + color[0] + ',' + color[1] + ')">' + initial + '</div>';
      return '<div class="mention-user-item" onclick="insertMention(\'' + u.username.replace(/'/g, "\\'") + '\')">' +
        avatarHtml +
        '<span class="mention-name">' + u.username + '</span>' +
      '</div>';
    }).join('');
  }

  function filterMentionUsers() {
    const val = document.getElementById('mentionSearch').value.trim();
    renderMentionUsers(val || undefined);
  }

  function sendMention() {
    const val = document.getElementById('mentionSearch').value.trim();
    if (!val) return;
    // 把@用户名写入底部输入框，然后直接发送
    const input = document.getElementById('bottomInput');
    input.value = '@' + val + ' ';
    submitBottomComment();
  }

  function insertMention(username) {
    const input = document.getElementById('bottomInput');
    const cursorPos = input.selectionStart || input.value.length;
    const textBefore = input.value.substring(0, cursorPos);
    const textAfter = input.value.substring(cursorPos);
    input.value = textBefore + '@' + username + ' ' + textAfter;
    closeMentionPanel();
    input.focus();
    const newPos = cursorPos + username.length + 2;
    input.setSelectionRange(newPos, newPos);
    toggleSendBtn();
  }

  // 表情面板
  const EMOJI_DATA = {
    '常用': ['😊','😂','🤣','😅','😍','🥰','😘','😜','🤔','😴','😭','😤','😱','🥺','😏','👍','👏','🙏','💪','❤️','🔥','🎉','✨','🌹','💯','😎','🐂','🍺','🎁','⭐','🌟'],
    '手势': ['👍','👎','👌','✌️','🤞','🤟','🤘','👊','✊','🤛','🤜','👏','🙌','👐','🤲','🙏','💪','🖐️','✋','🤚','🖖','👋','🤙','💅','👈','👉','👆','👇','☝️','👂','👃'],
    '爱心': ['❤️','🧡','💛','💚','💙','💜','🖤','🤍','🤎','💔','❣️','💕','💞','💓','💗','💖','💘','💝','💟','♥️','💌','💋','💍','💄','💋','🌹','🌷','🌸','🌺','🌻','🌼'],
    '动物': ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🙈','🙉','🙊','🐔','🐧','🐦','🐤','🦆','🦅','🦉','🦇','🐺','🐗','🐴','🦄','🐝'],
    '食物': ['🍎','🍐','🍊','🍋','🍌','🍉','🍇','🍓','🫐','🍈','🍒','🍑','🥭','🍍','🥥','🥝','🍅','🍆','🥑','🥦','🥬','🌽','🥕','🧄','🧅','🥔','🍠','🥐','🍞','🥖','🥨'],
    '物品': ['🎉','🎊','🎁','🎈','🎂','🍰','🧁','🍫','🍬','🍭','🍮','🍯','🍼','☕','🍵','🍶','🍺','🍻','🥂','🍷','🥃','🍸','🍹','🧃','🥤','🧋','☂️','🌂','👓','🕶️','⌚']
  };

  function toggleEmojiPanel() {
    const panel = document.getElementById('emojiPanel');
    const mentionPanel = document.getElementById('mentionPanel');
    const inputContainer = document.querySelector('.input-container');
    const imgPreview = document.getElementById('bottomImgPreview');
    if (panel.style.display === 'none') {
      panel.style.display = 'block';
      mentionPanel.style.display = 'none';
      inputContainer.style.display = 'none';
      imgPreview.style.display = 'none';
      renderEmojiGrid('常用');
    } else {
      closeEmojiPanel();
    }
  }

  function closeEmojiPanel() {
    const panel = document.getElementById('emojiPanel');
    const inputContainer = document.querySelector('.input-container');
    const imgPreview = document.getElementById('bottomImgPreview');
    panel.style.display = 'none';
    inputContainer.style.display = 'flex';
    if (_bottomImg) imgPreview.style.display = 'inline-block';
  }

  function closePanelsOnClick() {
    const mentionPanel = document.getElementById('mentionPanel');
    const emojiPanel = document.getElementById('emojiPanel');
    if (mentionPanel.style.display === 'block') {
      closeMentionPanel();
    }
    if (emojiPanel.style.display === 'block') {
      closeEmojiPanel();
    }
  }

  function switchEmojiCat(el, cat) {
    document.querySelectorAll('.emoji-cat').forEach(function(c) { c.classList.remove('active'); });
    el.classList.add('active');
    renderEmojiGrid(cat);
  }

  function renderEmojiGrid(cat) {
    const grid = document.getElementById('emojiGrid');
    const emojis = EMOJI_DATA[cat] || EMOJI_DATA['常用'];
    grid.innerHTML = emojis.map(function(e) {
      return '<div class="emoji-item" onclick="insertEmoji(\'' + e + '\')">' + e + '</div>';
    }).join('');
  }

  function insertEmoji(emoji) {
    const input = document.getElementById('bottomInput');
    const cursorPos = input.selectionStart || input.value.length;
    const textBefore = input.value.substring(0, cursorPos);
    const textAfter = input.value.substring(cursorPos);
    input.value = textBefore + emoji + textAfter;
    closeEmojiPanel();
    input.focus();
    const newPos = cursorPos + emoji.length;
    input.setSelectionRange(newPos, newPos);
    toggleSendBtn();
  }

  document.getElementById('inputContent').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      addComment();
    }
  });

  initAvatarUpload();
  initPresetAvatarUpload();
  renderPresetAvatars();

  // 自动记忆：绑定所有表单元素保存
  SAVE_IDS.forEach(function(id) {
    var el = document.getElementById(id);
    if (el) {
      el.addEventListener('input', saveState);
      el.addEventListener('change', saveState);
    }
  });
  // 上传类元素保存
  var uploadEls = ['videoBgFile', 'videoBgVideoFile', 'videoAvatarFile', 'replyAvatarFile', 'avatarFile'];
  uploadEls.forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('change', saveState);
  });

  // 恢复自动记忆开关（开关状态本身始终记忆）
  try {
    var mem = localStorage.getItem('dy_mock_memory_enabled');
    if (mem !== null) document.getElementById('settingMemory').checked = (mem === '1');
  } catch (e) {}
  loadState();
  loadComments();

  // 动态时间：未选时间的评论/回复，相对时间随现实时间推移自动增长
  function fmtDynamicTime(ts) {
    var diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
    if (diff < 2592000) return Math.floor(diff / 86400) + '天前';
    return Math.floor(diff / 2592000) + '个月前';
  }
  setInterval(function() {
    document.querySelectorAll('.comment-time[data-ts]').forEach(function(el) {
      el.textContent = fmtDynamicTime(parseInt(el.getAttribute('data-ts')));
    });
  }, 30000);

  renderComments();

  // 底部输入框聚焦/失焦切换布局
  const bottomInput = document.getElementById('bottomInput');
  const commentInputBar = document.getElementById('commentInputBar');
  const bottomInputCount = document.getElementById('bottomInputCount');
  if (bottomInput && bottomInputCount) {
    bottomInput.addEventListener('focus', function() {
      bottomInputCount.style.display = 'block';
      updateBottomCount();
    });
    bottomInput.addEventListener('input', updateBottomCount);
    bottomInput.addEventListener('blur', function() {
      if (bottomInput.value.length === 0) {
        bottomInputCount.style.display = 'none';
      }
    });
    bottomInput.maxLength = 100;
  }
  function updateBottomCount() {
    if (bottomInput && bottomInputCount) {
      bottomInputCount.textContent = bottomInput.value.length + '/100';
    }
  }
  bottomInput.addEventListener('focus', function() {
    commentInputBar.classList.add('focused');
  });
  bottomInput.addEventListener('blur', function() {
    setTimeout(function() {
      if (document.activeElement !== bottomInput &&
          !document.getElementById('mentionSearch').matches(':focus')) {
        commentInputBar.classList.remove('focused');
      }
    }, 200);
  });
  // Ctrl+Enter发送
  bottomInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      submitBottomComment();
    }
  });
</script>

</body>
